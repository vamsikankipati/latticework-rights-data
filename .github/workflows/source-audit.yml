name: Audit official sources
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: audit-baseline/
          key: rights-audit-${{ github.run_id }}
          restore-keys: rights-audit-
      - run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python publisher.py collect --output staging --baseline audit-baseline/observations.json
          python document_ingest.py discover --observations staging/observations.json --source-dir staging --output staging/document-candidates.json
          python document_ingest.py collect --output staging/documents --baseline audit-baseline/documents.json
          mkdir -p audit-baseline
          cp staging/observations.json audit-baseline/observations.json
          cp staging/documents/documents.json audit-baseline/documents.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: |
            staging/observations.json
            staging/document-candidates.json
            staging/documents/documents.json
          retention-days: 3
